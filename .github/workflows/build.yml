name: Build Glass APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Skip the obsolete default "tools" package (removed from the SDK repo,
          # which makes the action fail). Gradle/AGP auto-downloads the platform
          # and build-tools it needs during assembleDebug.
          packages: ""

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK with build number
        run: cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}
          path: app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Glass build ${{ github.run_number }}
          body: |
            Automated debug build of Glass.

            - Commit: ${{ github.sha }}
            - Download **app-debug.apk** below and install it on your phone.
            - Signed with the repo's fixed debug keystore, so it installs over any previous build (no uninstall needed).
          files: app-debug.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
